[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "v-me-50-rag"
version = "0.1.0"
description = "Movie recommendation RAG core and backend integration contract"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "langchain-core==0.3.79",
  "langchain-openai==0.3.35",
  "numpy>=1.26,<3",
  "pydantic>=2.7,<3",
  "sentence-transformers>=3,<6",
]

[project.optional-dependencies]
data = ["huggingface-hub>=0.30,<2", "pandas>=2,<3"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
